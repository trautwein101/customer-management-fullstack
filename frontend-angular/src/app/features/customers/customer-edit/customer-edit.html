
<h2>Edit Customer</h2>

<a routerLink="/customers">Back</a>

@if (isLoading() && !customer()) {
  <p>Loading customer...</p>
}

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

@if (customer()) {
  <app-customer-form
    [customer]="customer()"
    [isLoading]="isLoading()"
    (save)="saveCustomer($event)"
  />
}
