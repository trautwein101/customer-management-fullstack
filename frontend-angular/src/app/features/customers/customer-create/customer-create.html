<h2>Create Customer</h2>

<a routerLink="/customers">Back</a>

<app-customer-form
  [isLoading]="isLoading()"
  (save)="saveCustomer($event)"
/>

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}
